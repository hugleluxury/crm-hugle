<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM HUGLE</title>
<meta name="description" content="CRM HUGLE: CRM gratuito y de código abierto con 3 agentes de IA locales (HGLmini1.1flash). Tus clientes, oportunidades y tareas en tu portátil o tu móvil, sin servidores.">
<meta name="theme-color" content="#0B0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="icon" href="img/icono-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
<script>
  // Tema antes de pintar, para que no parpadee.
  try { const t = localStorage.getItem('crm-tema'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-contactos" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5 5 0 0 1 3.5 6"/></symbol>
  <symbol id="i-embudo" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/></symbol>
  <symbol id="i-ia" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
  <symbol id="i-resultados" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-plantillas" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-buscar" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-tel" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
  <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.2 3.1z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a5 5 0 0 1-2.8-2.8l.8-1-1-2z"/></symbol>
  <symbol id="i-subir" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
  <symbol id="i-bajar" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-papelera" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-editar" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></symbol>
  <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-atras" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-enviar" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="i-copiar" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-euro" viewBox="0 0 24 24"><path d="M17 6.5A7 7 0 1 0 17 17.5M4 10h9M4 14h9"/></symbol>
  <symbol id="i-rayo" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-luna" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-escudo" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-parar" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
</svg>

<div class="app">
  <aside class="lateral" aria-label="Menú principal">
    <div class="marca"><img id="marca-logo" src="img/logo.svg" alt=""><div><b id="marca-nombre">CRM HUGLE</b><small>Gratis · código abierto</small></div></div>
    <nav class="nav" id="nav">
      <a data-ir="inicio">${i:inicio}Inicio <em id="n-hoy"></em></a>
      <a data-ir="contactos">${i:contactos}Contactos</a>
      <a data-ir="embudo">${i:embudo}Embudo de ventas</a>
      <a data-ir="agenda">${i:agenda}Agenda y tareas</a>
      <small>Inteligencia</small>
      <a data-ir="asistente">${i:ia}Agentes IA <em id="n-bandeja"></em></a>
      <a data-ir="resultados">${i:resultados}Resultados</a>
      <a data-ir="plantillas">${i:plantillas}Plantillas</a>
      <small>Configuración</small>
      <a data-ir="ajustes">${i:ajustes}Ajustes</a>
    </nav>
    <div class="pie">
      <button class="chip-ia" id="chip-ia" type="button"><img src="img/hglmini.svg" alt=""><div class="crece"><b>HGLmini1.1flash</b><span id="chip-ia-txt"><i class="punto"></i> Apagada</span></div></button>
    </div>
  </aside>

  <div class="principal">
    <header class="cabecera">
      <button class="btn fant ico solo-movil" id="btn-menu" aria-label="Abrir menú"><svg class="i"><use href="#i-menu"/></svg></button>
      <h1 id="titulo">Inicio</h1>
      <label class="buscador"><svg class="i"><use href="#i-buscar"/></svg><input id="buscar" type="search" placeholder="Buscar contacto…" autocomplete="off"></label>
      <button class="btn fant ico" id="btn-tema" aria-label="Cambiar tema"><svg class="i"><use href="#i-sol"/></svg></button>
      <button class="btn prim" id="btn-nuevo"><svg class="i"><use href="#i-mas"/></svg><span>Nuevo</span></button>
    </header>
    <main class="vista" id="vista" tabindex="-1"></main>
  </div>
</div>

<nav class="abajo" id="abajo" aria-label="Navegación">
  <a data-ir="inicio"><svg class="i"><use href="#i-inicio"/></svg>Inicio</a>
  <a data-ir="contactos"><svg class="i"><use href="#i-contactos"/></svg>Contactos</a>
  <a data-ir="embudo"><svg class="i"><use href="#i-embudo"/></svg>Embudo</a>
  <a data-ir="agenda"><svg class="i"><use href="#i-agenda"/></svg>Agenda</a>
  <a data-ir="asistente"><svg class="i"><use href="#i-ia"/></svg>Agentes</a>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<script>
  // Iconos del menú: ${i:nombre} → <svg>
  for (const a of document.querySelectorAll('#nav a')) a.innerHTML = a.innerHTML.replace(/\$\{i:(\w+)\}/, '<svg class="i"><use href="#i-$1"/></svg>');
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
